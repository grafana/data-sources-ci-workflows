# Description:
# Posts a Cloud E2E test failure notification to Slack using Block Kit, as a
# reply in a single thread per UTC day so every caller's nightly failures land
# together (see README.md).
# Intended for callers of playwright-cloud.yml (e.g. a plugin's cron.yml) to
# notify on failure, since the reusable workflow itself doesn't own
# notification policy.
#
# Usage note:
# - This action fetches the Slack token through
#   grafana/shared-workflows/actions/get-vault-secrets, which authenticates via
#   OIDC. The calling job MUST grant `id-token: write` permissions (and
#   `contents: read`), otherwise the Slack step will fail.
# - Reference this action by its FULL path
#   (grafana/data-sources-ci-workflows/.github/actions/notify-cloud-e2e-failure@<ref>),
#   never by a local `./.github/actions/...` path — a local path resolves against
#   the calling repository, not this one.
# - See README.md for a worked example of wiring this into a caller's cron.yml.

name: Notify Slack on Cloud E2E failure
description: Post a Cloud E2E test failure notification to Slack.

inputs:
  slack-channel-id:
    description: Slack channel ID to post the message to.
    required: false
    # #grafana-data-sources-releases
    default: C0BQS6PFW14
  daily-thread:
    description: Post as a reply in the channel's shared thread for the current UTC day ("true"), or as a top-level message ("false").
    required: false
    default: "true"
  repo:
    description: Repository the failure originated from (e.g. github.repository).
    required: true
  run-stage:
    description: Rollout stage the run represents (e.g. pr, main, nightly, dev0, ops, prod0-4, catalog).
    required: false
    default: ""
  grafana-url:
    description: Grafana Cloud instance URL the tests ran against.
    required: false
    default: ""
  datasource-version:
    description: Datasource plugin version under test.
    required: false
    default: ""
  ref-name:
    description: Git ref name the run was triggered on (e.g. github.ref_name).
    required: false
    default: ""
  actor:
    description: User that triggered the run (e.g. github.actor).
    required: false
    default: ""
  sha:
    description: Commit SHA associated with the run (e.g. github.sha).
    required: false
    default: ""
  run-url:
    description: URL of the failed workflow run.
    required: true

# Slack assigns a message its identity on post, so a caller that wants to thread
# under this notification or edit it later has no way to address it unless the
# identity is handed back. All values come straight from post_notification.py.
outputs:
  ts:
    description: Timestamp identifying the posted message, used as `ts` to update it.
    value: ${{ steps.notify-slack.outputs.ts }}
  thread-ts:
    description: Timestamp of the day's parent message the notification replied under, used as `thread_ts` to add to the thread. Empty when posted top level.
    value: ${{ steps.notify-slack.outputs.thread-ts }}
  channel-id:
    description: Channel the message was posted to, resolved from the input or its default.
    value: ${{ steps.notify-slack.outputs.channel-id }}

runs:
  using: composite
  steps:
    # The same token send-slack-message uses. Fetched directly because the
    # daily thread lookup needs conversations.history's response, which
    # send-slack-message doesn't expose.
    - name: Get a Slack token
      id: get-secrets
      uses: grafana/shared-workflows/actions/get-vault-secrets@e46fe1e9a2bf9e618bcf8d8d32f3a7381b45c06d # get-vault-secrets/v2.0.0
      with:
        common_secrets: |
          SLACK_BOT_TOKEN=slack-notifications:oauth-token

    - name: Notify Slack
      id: notify-slack
      shell: bash
      env:
        SLACK_BOT_TOKEN: ${{ fromJSON(steps.get-secrets.outputs.secrets).SLACK_BOT_TOKEN }}
        SLACK_CHANNEL_ID: ${{ inputs.slack-channel-id }}
        DAILY_THREAD: ${{ inputs.daily-thread }}
        REPO: ${{ inputs.repo }}
        RUN_STAGE: ${{ inputs.run-stage }}
        GRAFANA_URL: ${{ inputs.grafana-url }}
        DATASOURCE_VERSION: ${{ inputs.datasource-version }}
        REF_NAME: ${{ inputs.ref-name }}
        ACTOR: ${{ inputs.actor }}
        SHA: ${{ inputs.sha }}
        RUN_URL: ${{ inputs.run-url }}
      run: python3 "$GITHUB_ACTION_PATH/post_notification.py"
