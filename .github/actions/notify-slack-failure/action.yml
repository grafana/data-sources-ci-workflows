# Description:
# Posts a Cloud E2E test failure notification to Slack using Block Kit.
# Intended for callers of playwright-cloud.yml (e.g. a plugin's cron.yml) to
# notify on failure, since the reusable workflow itself doesn't own
# notification policy.
#
# Usage note:
# - This action calls grafana/shared-workflows/actions/send-slack-message, which
#   authenticates via OIDC. The calling job MUST grant `id-token: write`
#   permissions (and `contents: read`), otherwise the Slack step will fail.
# - Reference this action by its FULL path
#   (grafana/data-sources-ci-workflows/.github/actions/notify-slack-failure@<ref>),
#   never by a local `./.github/actions/...` path — a local path resolves against
#   the calling repository, not this one.
# - See README.md for a worked example of wiring this into a caller's cron.yml.

name: Notify Slack on Cloud E2E failure
description: Post a Cloud E2E test failure notification to Slack.

inputs:
  slack-channel-id:
    description: Slack channel ID to post the message to.
    required: false
    # #grafana-ds-plugins-dev
    default: C0APH909GFK
  repo:
    description: Repository the failure originated from (e.g. github.repository).
    required: true
  run-stage:
    description: Rollout stage the run represents (e.g. pr, main, nightly, dev0, ops, prod0-4, catalog).
    required: false
    default: ""
  grafana-url:
    description: Grafana Cloud instance URL the tests ran against.
    required: false
    default: ""
  datasource-version:
    description: Datasource plugin version under test.
    required: false
    default: ""
  ref-name:
    description: Git ref name the run was triggered on (e.g. github.ref_name).
    required: false
    default: ""
  actor:
    description: User that triggered the run (e.g. github.actor).
    required: false
    default: ""
  sha:
    description: Commit SHA associated with the run (e.g. github.sha).
    required: false
    default: ""
  run-url:
    description: URL of the failed workflow run.
    required: true

runs:
  using: composite
  steps:
    - name: Build Slack notification payload
      id: slack-payload
      shell: bash
      env:
        SLACK_CHANNEL_ID: ${{ inputs.slack-channel-id }}
        REPO: ${{ inputs.repo }}
        RUN_STAGE: ${{ inputs.run-stage }}
        GRAFANA_URL: ${{ inputs.grafana-url }}
        DATASOURCE_VERSION: ${{ inputs.datasource-version }}
        REF_NAME: ${{ inputs.ref-name }}
        ACTOR: ${{ inputs.actor }}
        SHA: ${{ inputs.sha }}
        RUN_URL: ${{ inputs.run-url }}
      run: |
        python3 <<'PY' >> "$GITHUB_OUTPUT"
        import json
        import os

        channel = os.environ["SLACK_CHANNEL_ID"]
        repo = os.environ["REPO"]
        run_stage = os.environ.get("RUN_STAGE", "")
        grafana_url = os.environ.get("GRAFANA_URL", "")
        datasource_version = os.environ.get("DATASOURCE_VERSION", "")
        ref_name = os.environ.get("REF_NAME", "")
        actor = os.environ.get("ACTOR", "")
        sha = os.environ.get("SHA", "")[:8]
        run_url = os.environ["RUN_URL"]

        def slack_escape(value):
            return str(value).replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

        fallback = f"Cloud E2E tests failed for {slack_escape(repo)} ({slack_escape(run_stage)})"

        fields = [
            {"type": "mrkdwn", "text": f"*Repository:*\n{slack_escape(repo)}"},
            {"type": "mrkdwn", "text": f"*Run stage:*\n{slack_escape(run_stage)}"},
            {"type": "mrkdwn", "text": f"*Branch:*\n{slack_escape(ref_name)}"},
            {"type": "mrkdwn", "text": f"*Triggered by:*\n{slack_escape(actor)}"},
        ]

        if grafana_url:
            fields.append({"type": "mrkdwn", "text": f"*Grafana Cloud URL:*\n{slack_escape(grafana_url)}"})
        if datasource_version:
            fields.append({"type": "mrkdwn", "text": f"*Datasource version:*\n{slack_escape(datasource_version)}"})

        fields.append({"type": "mrkdwn", "text": f"*Commit:*\n`{slack_escape(sha)}`"})

        payload = {
            "channel": channel,
            "text": fallback,
            "blocks": [
                {
                    "type": "section",
                    "text": {"type": "mrkdwn", "text": f":x: *Cloud E2E tests failed*\n{fallback}"},
                },
                {
                    "type": "section",
                    "fields": fields,
                },
                {
                    "type": "section",
                    "text": {"type": "mrkdwn", "text": f"<{run_url}|View the failed run>"},
                },
            ],
        }

        print("payload<<EOF")
        print(json.dumps(payload))
        print("EOF")
        PY

    - name: Notify Slack
      uses: grafana/shared-workflows/actions/send-slack-message@551bc8d50017d3e95d5da3f8a4826e733a208dc0 # send-slack-message/v3.0.2
      with:
        method: chat.postMessage
        payload: ${{ steps.slack-payload.outputs.payload }}
        payload-templated: false
