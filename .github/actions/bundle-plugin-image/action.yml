# Description:
# Bakes an already-built, already-signed plugin dist onto a Grafana base image, boot-smokes
# the result, and only then pushes it. Used by cd-bundled.yml; also usable directly by a repo
# that wants the bundling without the surrounding pipeline.
#
# Ordering note:
# The build loads locally and does NOT push, the smoke test runs against that local image, and
# the push is a separate step. That ordering is deliberate: a bad image must never reach the GAR,
# so it cannot be replaced by a build-and-push action.
#
# Usage notes:
# - The calling job MUST already be logged in to the GAR. The base image lives in a private
#   repository (docker-grafana-enterprise-prod), so the build cannot pull without credentials.
# - Reference this action by its FULL path
#   (grafana/data-sources-ci-workflows/.github/actions/bundle-plugin-image@<ref>),
#   never by a local `./.github/actions/...` path — a local path resolves against the calling
#   repository, not this one.

name: Bundle a plugin into a Grafana image
description: Bake a signed plugin dist onto a Grafana base image, smoke-test it, then push.

inputs:
  image:
    description: Full image reference to build and push, including the tag.
    required: true
  plugin-id:
    description: Plugin id, for example grafana-clickhouse-datasource.
    required: true
  plugin-version:
    description: Plugin version being bundled, recorded as the plugin.version label.
    required: true
  grafana-image:
    description: Full grafana-pro image reference to bundle onto.
    required: true
  dist-zip:
    description: >-
      Path to the signed linux_amd64 plugin zip. Its single top-level directory is renamed to
      dist/ before the build, so the Dockerfile always copies from the same place.
    required: true
  source-repo-url:
    description: Repository the plugin was built from, recorded as the image source label.
    required: false
    default: ${{ github.server_url }}/${{ github.repository }}
  push:
    description: Whether to push the image after the smoke test passes.
    required: false
    default: "false"

outputs:
  digest:
    description: Digest of the pushed image, empty when push is false.
    value: ${{ steps.push.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Unpack the signed plugin dist
      shell: bash
      env:
        DIST_ZIP: ${{ inputs.dist-zip }}
        PLUGIN_ID: ${{ inputs.plugin-id }}
      run: |
        set -euo pipefail
        [ -f "$DIST_ZIP" ] || { echo "::error::dist zip not found: $DIST_ZIP"; exit 1; }

        rm -rf ./dist ./.bundle-unpack
        mkdir -p ./.bundle-unpack
        unzip -q "$DIST_ZIP" -d ./.bundle-unpack

        # The zip contains exactly one top-level directory, named for the plugin id. Rename it
        # rather than assuming the name, so a plugin whose zip root differs still works.
        root="$(find ./.bundle-unpack -mindepth 1 -maxdepth 1 -type d | head -1)"
        [ -n "$root" ] || { echo "::error::no top-level directory inside $DIST_ZIP"; exit 1; }
        mv "$root" ./dist

        # Fail here rather than in the smoke test, which is a slower way to learn the same thing.
        [ -f ./dist/MANIFEST.txt ] \
          || { echo "::error::unpacked dist has no MANIFEST.txt, so the plugin is unsigned"; exit 1; }
        echo "unpacked $(du -sh ./dist | cut -f1) into ./dist for $PLUGIN_ID"

    - name: Set up Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Build the bundled image locally
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: ${{ github.action_path }}/Dockerfile.bundled-plugin
        platforms: linux/amd64
        # Loaded, not pushed: the smoke test below has to run before anything reaches the GAR.
        load: true
        push: false
        provenance: false
        tags: ${{ inputs.image }}
        build-args: |
          GRAFANA_IMAGE=${{ inputs.grafana-image }}
          PLUGIN_ID=${{ inputs.plugin-id }}
          PLUGIN_VERSION=${{ inputs.plugin-version }}
          SOURCE_REPO_URL=${{ inputs.source-repo-url }}

    - name: Boot-smoke the image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        PLUGIN_ID: ${{ inputs.plugin-id }}
      run: bash "${{ github.action_path }}/smoke-test-bundled-plugin.sh" "$IMAGE" "$PLUGIN_ID"

    - name: Push the image
      id: push
      if: inputs.push == 'true'
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        docker push "$IMAGE"
        digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)"
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
        echo "pushed $IMAGE ($digest)"
