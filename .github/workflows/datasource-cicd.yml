# Description:
# Reusable CI/CD pipeline for a Grafana datasource plugin. Plugin repos call this
# from a thin `push.yml` caller.
#
# On pull requests it runs CI. On pushes to main it runs release-please and, when a
# release is cut, publishes that tag to the prod catalog. It exposes release_created
# and tag_name as outputs so the caller publishes normal main builds to the dev
# catalog itself: dev-publish is NOT routed through here, because
# caller -> this workflow -> cd-dev.yml -> cd.yml -> ci.yml is five levels, one over
# GitHub's 4-level reusable-workflow nesting cap.
#
# Docs minting note:
# GATB (grafana-plugins-platform-bot) keys the docs mint on the TOP-LEVEL
# `workflow_ref`, which is the plugin's own `push.yml` caller. Keeping the release
# logic here (caller -> this reusable workflow -> cd.yml) preserves that mapping,
# so docs are never minted from a `release-please.yml` path.

name: Datasource - CI/CD

on:
  workflow_call:
    inputs:
      trufflehog-exclude-detectors:
        description: |
          Comma-separated list of TruffleHog detector types to exclude, forwarded
          to cd.yml. Set it when a detector false-positives on the plugin's signed
          build output. Without this pass-through a caller cannot express the
          exclusion, because it does not call cd.yml directly.
        type: string
        required: false
    outputs:
      release_created:
        description: Whether release-please cut a release on this run.
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: The tag release-please created, if any.
        value: ${{ jobs.release-please.outputs.tag_name }}

permissions: {}

jobs:
  ci:
    name: CI
    if: github.event_name == 'pull_request'
    # GitHub forbids expressions in a reusable-workflow `uses:` ref, so this ref
    # is static here (bumped centrally in this repo, e.g. by Renovate).
    uses: grafana/plugin-ci-workflows/.github/workflows/ci.yml@ci-cd-workflows/v11.1.1
    permissions:
      contents: read
      id-token: write
    with:
      # Ensure PR builds produce unique plugin versions.
      plugin-version-suffix: ${{ github.event.pull_request.head.sha }}

  release-please:
    name: Run release-please
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # PRs created with the default GITHUB_TOKEN get their CI runs held in
      # an approval-required state instead of running automatically, so the
      # release PR is created with an app token.
      - name: Generate GitHub token
        id: generate-github-token
        uses: grafana/shared-workflows/actions/create-github-app-token@46f48da11e78ebdba7a8747ae456b11062fac83e # create-github-app-token/v0.3.1
        with:
          github_app: grafana-oss-big-tent

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.generate-github-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  # When release-please cuts a release, publish that tag to the prod catalog. cd.yml tolerates the
  # pre-existing tag and attaches the plugin zips to the release that release-please created. Docs
  # and the GitHub release are disabled here: docs publish from the plugin's `publish.yml` on the
  # release event, and release-please already created the GitHub release.
  #
  # Scope: cd.yml's default, `universal`. There is deliberately no scope override.
  # `scopes` has no on-prem-only value — it is `universal`, `grafana_cloud`, or a named set of orgs
  # or instances — and there is no case for publishing a version to on-prem while withholding it
  # from Cloud. So the catalog carries one universally scoped version per release, published from
  # here and nowhere else, and the release pipeline stays identical for every data source whether or
  # not it has moved to bundled images.
  #
  # This does not make Cloud depend on the catalog. Once a data source ships bundled images, Cloud
  # gets the plugin from the image and reads nothing from the catalog; the catalog entry is then
  # metadata plus the on-prem download. Keeping the version universally scoped means the two
  # delivery paths never publish the same version twice, which a per-wave catalog publish alongside
  # this one would.
  publish-prod:
    name: Publish to prod catalog
    if: github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created == 'true'
    needs: release-please
    uses: grafana/plugin-ci-workflows/.github/workflows/cd.yml@ci-cd-workflows/v11.1.1
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    with:
      branch: ${{ needs.release-please.outputs.tag_name }}
      environment: prod
      disable-docs-publishing: true
      disable-github-release: true
      release-reference-regex: '^(main|v\d+\.\d+\.\d+)$'
      run-playwright: false
      github-draft-release: false
      trufflehog-exclude-detectors: ${{ inputs.trufflehog-exclude-detectors }}
