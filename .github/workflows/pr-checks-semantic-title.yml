name: PR Conventional Commit Validation

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-title:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types. Keep aligned with https://www.conventionalcommits.org/
          # and with the changelog-sections in release-please-config.json.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          # Require the subject to start with a lowercase letter.
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            The subject (after the "type:" prefix) must start with a lowercase letter.
            Example: "fix(cd-dev): forward the deploy input to the rollout job"
