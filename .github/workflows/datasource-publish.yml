# Description:
# Reusable publish workflow for a Grafana datasource plugin. Plugin repos call
# this from a thin `publish.yml` caller.
#
# Two paths, selected by the top-level caller's event:
#  - `release` (published): publish docs for the released tag to the website.
#  - `workflow_dispatch`: a manual publish, forwarding the caller's dispatch
#    inputs (branch/environment/scopes/docs-only) to cd.yml.
#
# Docs minting note:
# GATB (grafana-plugins-platform-bot) keys the docs mint on the TOP-LEVEL
# `workflow_ref`, which is the plugin's own `publish.yml` caller. Keeping the docs
# publish here (caller -> this reusable workflow -> cd.yml) preserves that mapping,
# so the mint stays keyed on the plugin's `publish.yml`.

name: Datasource - Publish plugin

on:
  workflow_call:
    inputs:
      # Manual-dispatch pass-throughs. The plugin's `publish.yml` collects these
      # from its own `workflow_dispatch` inputs and forwards them. They are ignored
      # on the `release` event (the `docs` job reads github.event.release instead).
      branch:
        description: Branch or tag to publish from (manual dispatch).
        type: string
        required: false
        default: main
      environment:
        description: Catalog environment to publish to (manual dispatch).
        type: string
        required: false
        default: prod
      scopes:
        description: Publishing scopes for the catalog (manual dispatch).
        type: string
        required: false
        default: grafana_cloud
      docs-only:
        description: Only publish docs, do not publish the plugin (manual dispatch).
        type: boolean
        required: false
        default: false
      trufflehog-exclude-detectors:
        description: |
          Comma-separated list of TruffleHog detector types to exclude, forwarded
          to cd.yml. Set it when a detector false-positives on the plugin's signed
          build output. Without this pass-through a caller cannot express the
          exclusion, because it does not call cd.yml directly.
        type: string
        required: false

permissions: {}

jobs:
  # Auto-publish docs when a release is published. release-please creates the
  # release with the grafana-oss-big-tent token, so this event fires; the run is
  # docs-only and mints the platform bot via the grant keyed to the plugin's
  # `publish.yml` caller.
  docs:
    name: Publish docs
    if: github.event_name == 'release'
    # GitHub forbids expressions in a reusable-workflow `uses:` ref, so this ref
    # is static here (bumped centrally in this repo, e.g. by Renovate).
    uses: grafana/plugin-ci-workflows/.github/workflows/cd.yml@ci-cd-workflows/v11.1.1
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    with:
      branch: ${{ github.event.release.tag_name }}
      environment: prod
      docs-only: true
      scopes: grafana_cloud
      # Anchored so a ref merely containing a match is not treated as a release.
      release-reference-regex: '^(main|v\d+\.\d+\.\d+)$'
      run-playwright: false
      github-draft-release: false
      trufflehog-exclude-detectors: ${{ inputs.trufflehog-exclude-detectors }}

  # Manual publish: forward the caller's dispatch inputs to cd.yml.
  manual:
    name: Manual publish
    if: github.event_name == 'workflow_dispatch'
    uses: grafana/plugin-ci-workflows/.github/workflows/cd.yml@ci-cd-workflows/v11.1.1
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    with:
      branch: ${{ inputs.branch }}
      environment: ${{ inputs.environment }}
      scopes: ${{ inputs.scopes }}
      docs-only: ${{ inputs.docs-only }}
      run-playwright: false
      github-draft-release: false
      trufflehog-exclude-detectors: ${{ inputs.trufflehog-exclude-detectors }}
